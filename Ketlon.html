<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الهيكل العظمي 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; color: white; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #info-box {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); padding: 15px 30px; border-radius: 10px;
            font-size: 20px; display: none; text-align: center; border: 1px solid #444;
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; font-weight: bold; color: #ffcc00;
        }
    </style>
</head>
<body>

    <div id="loading">جاري تحميل الهيكل العظمي...</div>
    <div id="info-box">اسم العظمة</div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'; // استدعاء أداة تحميل المجسمات الحقيقية

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3); // ضبط الكاميرا لتناسب طول الإنسان

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // إضاءة قوية عشان نشوف تفاصيل العظام
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0); // التركيز على منتصف الجسم

        let skeletonModel;

        // --- السر هنا: سحب ملف الهيكل العظمي الحقيقي ---
        const loader = new GLTFLoader();
        
        // هنا بنقوله هات الملف اللي اسمه skeleton.glb اللي معاك في الفولدر
        loader.load( 'skeleton.glb', function ( gltf ) {
            
            skeletonModel = gltf.scene;
            
            // تصغير أو تكبير المجسم ليناسب الشاشة (حسب حجم الملف اللي هتحمله)
            skeletonModel.scale.set(1, 1, 1); 
            
            // توسيط الهيكل
            skeletonModel.position.y = -1;

            scene.add( skeletonModel );

            // إخفاء رسالة التحميل
            document.getElementById('loading').style.display = 'none';

        }, undefined, function ( error ) {
            console.error( 'حصل مشكلة في تحميل الهيكل، اتأكد إن الملف اسمه skeleton.glb وموجود في نفس الفولدر', error );
            document.getElementById('loading').innerText = 'خطأ: لم يتم العثور على ملف skeleton.glb';
        } );

        // تقنية التعرف على الضغطة (Raycaster)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const infoBox = document.getElementById('info-box');

        window.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // البحث عن العظمة المضروبة بالشعاع
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                const selectedBone = intersects[0].object;
                
                // عرض اسم العظمة (الاسم اللي مصمم الـ 3D كتبه وهو بيصممها)
                infoBox.innerText = selectedBone.name || "عظمة بدون اسم"; 
                infoBox.style.display = 'block';
                
            } else {
                infoBox.style.display = 'none';
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
