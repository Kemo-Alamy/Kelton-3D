<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الهيكل العظمي 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #11111d; color: white; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #info-box {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); padding: 12px 25px; border-radius: 8px;
            font-size: 18px; display: none; text-align: center; border: 1px solid #555; z-index: 10;
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 20px; font-weight: bold; color: #00d2ff; z-index: 5; text-align: center;
        }
    </style>
</head>
<body>

    <div id="loading">جاري تحميل الهيكل العظمي الكامل...<br>(قد يستغرق بضع ثوانٍ حسب سرعة الإنترنت)</div>
    <div id="info-box">اسم العظمة</div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // ضبط موقع الكاميرا ليناسب ارتفاع الهيكل العظمي الكامل
        camera.position.set(0, 1, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // إضاءة محيطة ومباشرة لإظهار تفاصيل العظام
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight1.position.set(2, 4, 2);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight2.position.set(-2, 2, -2);
        scene.add(dirLight2);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        const loader = new GLTFLoader();
        
        // رابط مباشر لمجسم هيكل عظمي كامل استضافة عامة
        const skeletonUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb';

        loader.load( skeletonUrl, function ( gltf ) {
            
            const model = gltf.scene;
            model.scale.set(0.2, 0.2, 0.2); // ضبط الحجم
            model.position.set(0, -0.5, 0);
            scene.add( model );

            document.getElementById('loading').style.display = 'none';

        }, undefined, function ( error ) {
            console.error( 'Error loading skeleton model:', error );
            document.getElementById('loading').innerText = 'حدث خطأ أثناء تحميل الهيكل العظمي';
            document.getElementById('loading').style.color = 'red';
        } );

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const infoBox = document.getElementById('info-box');

        window.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                const selectedObject = intersects[0].object;
                infoBox.innerText = selectedObject.name || "عظمة من الهيكل العظمي"; 
                infoBox.style.display = 'block';
            } else {
                infoBox.style.display = 'none';
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
